{% extends "base.html" %}

{% block title %}Új téma - {{ category.name }} - Fórum - PC-MAN{% endblock %}

{% block styles %}
<style>
.forum-content {
    background-color: #f8f9fa !important;
}
.breadcrumb-item a {
    color: #dc3545 !important;
    text-decoration: none;
}
.breadcrumb-item.active {
    color: #dc3545 !important;
}
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('forum_home') }}">Fórum</a></li>
            <li class="breadcrumb-item"><a href="{{ url_for('forum_category', category_id=category.id) }}">{{ category.name }}</a></li>
            <li class="breadcrumb-item active">Új téma</li>
        </ol>
    </nav>

    <div class="forum-content p-4">
        <div class="card">
            <div class="card-header bg-light">
                <h4 class="mb-0">Új téma létrehozása</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Cím</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">Tartalom</label>
                        <textarea class="form-control" id="content" name="content" rows="10" required></textarea>
                    </div>
                    <div class="text-end">
                        <a href="{{ url_for('forum_category', category_id=category.id) }}" class="btn btn-secondary me-2">Mégse</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus me-1"></i> Létrehozás
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    // Itt lehet további JavaScript funkciókat hozzáadni
    // Például: WYSIWYG editor inicializálása
});
</script>
{% endblock %}
