{% extends "base.html" %}

{% block title %}Fórum - PC-MAN{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-comments me-2"></i>Fórum</h2>
        <div>
            <form action="{{ url_for('forum_search') }}" method="GET" class="d-flex">
                <input type="text" name="q" class="form-control me-2" placeholder="Keresés a fórumban...">
                <button type="submit" class="btn btn-outline-primary">
                    <i class="fas fa-search"></i>
                </button>
            </form>
        </div>
    </div>

    {% for category in categories %}
    <div class="card mb-3">
        <div class="card-header bg-light">
            <h5 class="mb-0">
                <i class="fas fa-{{ category.icon or 'folder' }} me-2"></i>
                <a href="{{ url_for('forum_category', category_id=category.id) }}" class="text-decoration-none text-dark">
                    {{ category.name }}
                </a>
            </h5>
        </div>
        <div class="card-body">
            <p class="text-muted mb-0">{{ category.description }}</p>
        </div>
        <div class="card-footer bg-light">
            <small class="text-muted">
                <i class="fas fa-book me-1"></i> {{ category.topics|length }} téma
            </small>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
